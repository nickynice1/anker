# Übersetzt Anker, und auf Wunsch signiert sie und lädt sie nach TestFlight.
# Kein Mac vorhanden -- dieser Läufer ist der einzige Compiler des Projekts.
#
# GEHEIMNISSE (gesetzt über ios_geheimnisse.py-artiges Skript):
#   APP_STORE_CONNECT_KEY_ID, APP_STORE_CONNECT_ISSUER_ID,
#   APP_STORE_CONNECT_API_KEY, MATCH_PASSWORD, MATCH_GIT_BASIC_AUTHORIZATION
name: Prüfen

on:
  workflow_dispatch:
    inputs:
      hochladen:
        description: "Signieren und nach TestFlight hochladen (sonst nur im Simulator bauen)"
        type: boolean
        default: false

concurrency:
  group: pruefen-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Xcode-Fassung zeigen
        run: xcodebuild -version

      - name: XcodeGen
        run: brew install xcodegen

      - name: Projekt erzeugen
        run: xcodegen generate

      - name: Ruby und fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Im Simulator bauen (ohne Signatur)
        if: ${{ !inputs.hochladen }}
        run: bundle exec fastlane pruefen

      - name: Signieren und nach TestFlight
        if: inputs.hochladen
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
        run: bundle exec fastlane beta

      - name: Bauprotokoll sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bauprotokoll
          path: |
            ~/Library/Logs/gym/**
            /tmp/bau.log
          if-no-files-found: ignore
