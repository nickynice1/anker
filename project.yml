name: Anker
options:
  bundleIdPrefix: de.niklasbergmann
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # Feste Versionen statt `from:` -- ein `from:` holt bei jedem Bau die
  # neueste passende Fassung, und SwiftTerm ist so schon unbemerkt von 1.2.0
  # auf 1.99.2 gesprungen (samt neuem swift-tools-Mindeststand). Ein Bau kann
  # dadurch brechen, ohne dass sich an Ankers eigenem Quelltext etwas
  # geändert hat. Erhöhen nur bewusst, nicht automatisch.
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    exactVersion: 1.99.2
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    exactVersion: 0.12.1

targets:
  Anker:
    type: application
    platform: iOS
    sources:
      - path: Anker
    dependencies:
      - package: SwiftTerm
      - package: Citadel
    info:
      path: Anker/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Zum Entsperren deiner gespeicherten Zugangsdaten."
        # Ohne diesen Eintrag fragt App Store Connect bei JEDEM Build von
        # Hand nach der Exportkontroll-Einstufung. SSH nutzt zwar
        # Standardverschlüsselung, aber nur zur eigenen Anmeldung an selbst
        # betriebenen Servern, nicht öffentlich vertrieben und nicht in
        # Frankreich -- die Antwort war bei jedem bisherigen Build "NO".
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.niklasbergmann.anker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentAnker
        # Swift-6-Sprachmodus wollte Citadel/SwiftTerm (noch nicht vollständig
        # für die strengsten Sendable-Prüfungen vorbereitet) nicht durchlassen.
        # async/await und Actors funktionieren in Swift 5 genauso, nur die
        # schärfste Prüfstufe ist aus.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
