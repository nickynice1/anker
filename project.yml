name: Anker
options:
  bundleIdPrefix: de.niklasbergmann
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm.git
    from: 1.2.0
  Citadel:
    url: https://github.com/orlandos-nl/Citadel.git
    from: 0.8.0

targets:
  Anker:
    type: application
    platform: iOS
    sources:
      - path: Anker
    dependencies:
      - package: SwiftTerm
      - package: Citadel
    info:
      path: Anker/App/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSFaceIDUsageDescription: "Zum Entsperren deiner gespeicherten Zugangsdaten."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: de.niklasbergmann.anker
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentAnker
        # Swift-6-Sprachmodus wollte Citadel/SwiftTerm (noch nicht vollständig
        # für die strengsten Sendable-Prüfungen vorbereitet) nicht durchlassen.
        # async/await und Actors funktionieren in Swift 5 genauso, nur die
        # schärfste Prüfstufe ist aus.
        SWIFT_VERSION: "5.0"
        SWIFT_STRICT_CONCURRENCY: minimal
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
